<!doctype html>
<html lang="en" data-theme="couchcup">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" />
        <script src="https://kit.fontawesome.com/94fbbf70a6.js" crossorigin="anonymous"></script>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover"
        />
        <meta name="theme-color" content="#D8D1C0" />
        <title>Couch Cup</title>

        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#D02020" />
        <meta name="msapplication-TileColor" content="#D02020" />

        <!-- Bauhaus Typography -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
            rel="stylesheet"
        />
        %sveltekit.head%
    </head>

    <body data-sveltekit-preload-data="hover" class="flex flex-col h-dvh bg-[#D8D1C0] text-[#121212]">
        %sveltekit.body%
    </body>
</html>
